<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Sudoku - Sapphire Fun 💎</title>
    <link rel="stylesheet" href="sudoku.css">
</head>

<body>
    <h1>Today's Sudoku</h1>
    <hr>
    <h2 id="errors">Errors: 0</h2>
    <h2 id="win-message" style="color: green; display: none;">Congratulations! You Won!</h2>

    <!-- Difficulty -->
    <div style="margin-bottom: 15px;">
        <label for="difficulty">Difficulty: </label>
        <select id="difficulty">
            <option value="55">Easy</option>
            <option value="45" selected>Medium</option>
            <option value="35">Hard</option>
        </select>

        <button onclick="startNewGame()">New Game</button>
    </div>

    <div id="board"></div>
    <br>
    <div id="digits"></div>

    <script src="sudoku.js"></script>
</body>

</html>
