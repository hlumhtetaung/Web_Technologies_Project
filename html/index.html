<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapphire Fun 💎</title>
    <link rel="stylesheet" href="../css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <input type="checkbox" id="nav-toggle">

    <nav class="sidenav">
        <a href="#">About Us</a>
        <a href="#">Fun Facts</a>
        <a href="#">Game Reviews</a>
        <a href="#">Contact</a>
    </nav>

    <header class="header">
        <label for="nav-toggle" class="menu-label" aria-label="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 20 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="10" height="2" fill="#3B82F6" />
                <rect y="6" width="15" height="2" fill="#3B82F6" />
                <rect y="12" width="20" height="2" fill="#3B82F6" />
            </svg>
        </label>
        <div class="sapphire-logo">
            Sapphire Fun 💎
        </div>
    </header>

    <div class="main-content">
        <h2>Mini-Games</h2>
        <div class="mini-games">
            <div class="game-card">
                <img src="../images/tictactoe.png" alt="Tic Tac Toe Icon" class="game-icon">
                <h3>Tic Tac Toe</h3>
            </div>
            <div class="game-card">
                <img src="../images/wordle.png" alt="Wordle Icon" class="game-icon">
                <h3>Wordle</h3>
            </div>
            <div class="game-card">
                <img src="../images/whack.png" alt="Whack-a-Mole Icon" class="game-icon">
                <h3>Whack-a-Mole</h3>
            </div>
            <div class="game-card">
                <img src="../images/reaction.png" alt="Reaction Time Icon" class="game-icon">
                <h3>Reaction Time</h3>
            </div>
            <div class="game-card">
                <img src="../images/sudoku.png" alt="Sudoku Icon" class="game-icon">
                <h3>Sudoku</h3>
            </div>
        </div>
    </div>

</body>

</html>
